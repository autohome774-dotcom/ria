<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результати конкурсу</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            color: #222;
            text-align: center;
        }

        h2 {
            font-size: 1.3rem;
            font-weight: 600;
            margin-top: 50px;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #ff0000, #000, #ff0000);
            background-size: 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 3s infinite linear;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .partners {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin-bottom: 55px;
            flex-wrap: wrap;
        }

        .partners img {
            height: 100px;
            width: auto;
            object-fit: contain;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .partners img:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.2);
        }

        h1 {
            font-size: 1.7rem;
            max-width: 90%;
            line-height: 1.3;
            margin-bottom: 10px;
            color: #ff4e50;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .btn {
            background-color: #ff4e50;
            color: #fff;
            border: none;
            padding: 12px 38px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 35px;
        }

        .btn:hover {
            background-color: #f9d423;
            color: #000;
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
        }

        /* Таблиця призів */
        .prize-table {
            border-collapse: collapse;
            width: 85%;
            max-width: 500px;
            margin-bottom: 60px;
            font-size: 1rem;
        }

        .prize-table th, .prize-table td {
            border: 1px solid #ddd;
            padding: 10px 12px;
        }

        .prize-table th {
            background-color: #ff4e50;
            color: #fff;
            font-weight: bold;
        }

        .prize-table tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        .prize-table tr:hover {
            background-color: #ffe6e6;
        }
    </style>
</head>
<body>

    <h2>Конкурс від наших партнерів завершено</h2>

    <div class="partners">
        <img src="https://i.postimg.cc/MZ3qBknQ/1200x630wa-removebg-preview.png" alt="Авториа логотип">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTRBW2BuHQGCCko38sZpCuZMbyRma5_PzGXxUofwlM5fkDrt1n8KsOcdS0&s=10" alt="Партнер логотип">
    </div>

    <h1>Ваше оголошення на <strong>AUTO.RIA</strong> зайняло 9 місце в осінньому конкурсі!</h1>

    <p>Ваш приз — <strong>5000 гривень!</strong></p>

    <button class="btn" onclick="window.open('https://autoriakonkurs.onrender.com', '_blank')">
        Отримати виграш
    </button>

    <table class="prize-table">
        <tr>
            <th>Місце</th>
            <th>Приз</th>
        </tr>
        <tr><td>1 місце</td><td>50 000 грн</td></tr>
        <tr><td>2 місце</td><td>30 000 грн</td></tr>
        <tr><td>3 місце</td><td>15 000 грн</td></tr>
        <tr><td>4–10 місце</td><td>по 5 000 грн</td></tr>
    </table>

</body>
</html>
